    <header class="topbar">

    <main>
      <h1>Chime lab</h1>
      <p>Tune the chime before each announcement.</p>
      <p>With its sound on (it’s off by default), the site plays the Held chord. Comfort limits are always on: no harsh highs, clicks, fast wobble or loud peaks.</p>

      <h2>Pattern</h2><div id="patterns" class="chips"></div>
      <h2>Tone</h2><div id="voices" class="chips"></div>
      <h2>Knobs</h2><div id="knobs"></div>
      <div class="actions">
        <button class="play" id="play">Play</button>
        <button id="reset">Reset knobs</button>
        <button id="preset">Held chord preset</button>
      </div>

      <details>
        <summary>Settings</summary>
        <pre id="out"></pre>
        <div class="actions"><button id="copy">Copy settings</button></div>
      </details>
    </main>
